name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Decode Payload
        id: payload
        run: |
          echo '${{ github.event.inputs.payload }}' > payload.json
          echo "zipAssetUrl=$(jq -r .zipAssetUrl payload.json)" >> $GITHUB_OUTPUT
          
      - name: Download Project
        run: |
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
               -o project.zip \
               "${{ steps.payload.outputs.zipAssetUrl }}"
          mkdir -p project
          unzip -q project.zip -d project/
          
      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: project/app/build/outputs/apk/release/*.apk
          retention-days: 1
