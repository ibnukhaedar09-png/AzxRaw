name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID'
        required: true
        type: string
      userId:
        description: 'User ID'
        required: true
        type: string
      payload:
        description: 'Build Payload (JSON)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Decode Payload
        id: payload
        run: |
          echo '${{ github.event.inputs.payload }}' > payload.json
          echo "zipAssetUrl=$(jq -r .zipAssetUrl payload.json)" >> $GITHUB_OUTPUT
          echo "appName=$(jq -r .appName payload.json)" >> $GITHUB_OUTPUT
          echo "✅ Payload decoded successfully"
          echo "📦 Asset URL: ${{ steps.payload.outputs.zipAssetUrl }}"
          
      - name: Download Project ZIP
        run: |
          echo "📥 Downloading project from: ${{ steps.payload.outputs.zipAssetUrl }}"
          
          # Download using GITHUB_TOKEN (built-in token)
          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -o project.zip \
            "${{ steps.payload.outputs.zipAssetUrl }}" \
            --fail --silent --show-error
          
          # Check if download succeeded
          if [ ! -f project.zip ]; then
            echo "❌ Download failed - file not found"
            exit 1
          fi
          
          if [ ! -s project.zip ]; then
            echo "❌ Download failed - file is empty"
            exit 1
          fi
          
          echo "✅ Download successful! File size: $(du -h project.zip | cut -f1)"
          
          # Extract the project
          echo "📦 Extracting project..."
          mkdir -p project
          unzip -q project.zip -d project/
          
          if [ $? -ne 0 ]; then
            echo "❌ Failed to extract ZIP file"
            exit 1
          fi
          
          echo "✅ Extraction complete! Contents:"
          ls -la project/
          
      - name: Setup Gradle Wrapper
        run: |
          cd project
          if [ ! -f gradlew ]; then
            echo "⚠️ Gradle wrapper not found, generating..."
            gradle wrapper
          fi
          chmod +x gradlew
          echo "✅ Gradle wrapper ready"
          
      - name: Build APK
        run: |
          cd project
          echo "🔨 Building APK..."
          ./gradlew assembleRelease --no-daemon
          
          if [ $? -ne 0 ]; then
            echo "❌ Build failed"
            exit 1
          fi
          
          echo "✅ Build completed!"
          
      - name: Find APK
        id: find_apk
        run: |
          cd project
          echo "🔍 Searching for APK..."
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ No APK found!"
            exit 1
          fi
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "✅ APK found at: $APK_PATH"
          echo "📦 APK size: $(du -h "$APK_PATH" | cut -f1)"
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 1
          
      - name: Success Notification
        if: success()
        run: |
          echo "✅ Build successful for job ${{ github.event.inputs.jobId }}"
          echo "📱 APK: ${{ steps.find_apk.outputs.apk_path }}"
          
      - name: Failure Notification
        if: failure()
        run: |
          echo "❌ Build failed for job ${{ github.event.inputs.jobId }}"
          exit 1
